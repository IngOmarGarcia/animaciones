<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Personaliza tu animación | Detallito</title>
  <meta name="description" content="Escribe el nombre y un mensaje, crea tu enlace y compártelo por WhatsApp.">
  <meta name="theme-color" content="#0d0a1f">
  <meta property="og:title" content="Crea una sorpresa animada 💛">
  <meta property="og:description" content="Flores amarillas y animaciones para dedicar, gratis.">
  <meta property="og:image" content="https://tu-dominio.com/img/og.png">
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap">
  <link rel="stylesheet" href="css/styles.css">
  <!-- AdSense: script de tu cuenta aquí -->
</head>
<body>
  <header class="site-header">
    <a class="brand" href="./">💛 Detallito</a>
    <nav>
      <a href="./#galeria">Animaciones</a>
      <a href="acerca.html">Acerca</a>
    </nav>
  </header>

  <main class="container create">
    <nav class="crumbs"><a href="./#galeria">← Todas las animaciones</a></nav>

    <div class="create-layout">
      <div class="preview-col">
        <div class="phone">
          <div class="scene" id="scene">
            <canvas aria-hidden="true"></canvas>
            <div class="overlay show" id="overlay">
              <p class="ov-to"></p>
              <p class="ov-msg"></p>
              <p class="ov-from"></p>
            </div>
          </div>
        </div>
      </div>

      <div class="form-col">
        <h1 id="title">Personaliza tu animación</h1>
        <p class="muted" id="desc"></p>

        <form class="form" id="form" autocomplete="off">
          <label>¿Para quién es?
            <input name="p" maxlength="40" placeholder="Ej. María">
          </label>
          <label>Tu mensaje
            <textarea name="m" maxlength="140" rows="3"></textarea>
            <small id="counter">0/140</small>
          </label>
          <label>¿De parte de quién? <span class="muted">(opcional)</span>
            <input name="d" maxlength="40" placeholder="Ej. Juan">
          </label>
          <button class="btn btn-primary btn-block" type="submit">Crear enlace 💌</button>
        </form>

        <div class="result" id="result" hidden>
          <p class="ok">¡Listo! Tu sorpresa ya tiene enlace 🎉</p>
          <div class="link-row">
            <input id="link" readonly aria-label="Enlace para compartir">
            <button class="btn" id="copy" type="button">Copiar</button>
          </div>
          <div class="share-row">
            <a class="btn btn-wa" id="wa" target="_blank" rel="noopener">Enviar por WhatsApp</a>
            <button class="btn" id="native" type="button" hidden>Compartir</button>
            <a class="btn" id="open" target="_blank" rel="noopener">Ver cómo se ve</a>
          </div>
        </div>

        <div class="ad-slot" data-ad-slot="create"></div>
      </div>
    </div>

    <section>
      <div class="section-head"><h2>Otras animaciones</h2></div>
      <div class="grid" id="more"></div>
    </section>
  </main>

  <footer class="site-footer">
    <nav>
      <a href="acerca.html">Acerca y contacto</a>
      <a href="privacidad.html">Aviso de privacidad</a>
    </nav>
    <p>© 2026 Detallito</p>
  </footer>

  <script type="module" src="js/crear.js"></script>
</body>
</html>
