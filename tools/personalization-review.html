<!doctype html><html lang="es"><meta charset="utf-8"><meta name="robots" content="noindex, nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tipografías y colores · ViralCss</title><link rel="stylesheet" href="/css/styles.css"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap"><style>header{padding:24px}.samples{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;padding:12px}.sample{min-width:0}.sample .scene{height:480px;position:relative}.sample canvas{width:100%;height:100%}.sample h2{font-size:15px;margin:12px}.sample .overlay{padding:32px 16px}.sample .ov-msg{font-size:25px}.sample .ov-from{font-size:16px}iframe{width:100%;height:1600px;border:0}@media(max-width:700px){.samples{grid-template-columns:repeat(2,1fr)}} </style>
<header><h1>Elige tu estilo</h1><p id="checks">Comprobando…</p><a href="/crear.html?a=fantasmita-rosa">Personalizar Halloween</a> · <a href="/crear.html?a=medusas-bioluminiscentes">Personalizar medusas</a></header><main class="samples" id="samples"></main><iframe id="editor" src="/crear.html?a=fantasmita-rosa"></iframe>
<script type="module">
import {FONT_OPTIONS} from '../js/anim/text-style.js';import {getAnimation} from '../js/catalog.js';import {fillOverlay} from '../js/overlay.js';import {decodeCard} from '../js/share.js';
const report=document.getElementById('checks'),check=(v,m)=>{if(!v)throw Error(m)},anim=getAnimation('fantasmita-rosa'),mod=await anim.load();
try{
function pixels(card,t=5){const c=document.createElement('canvas');c.width=390;c.height=640;const ctx=c.getContext('2d');const stage={card,taps:[],pointer:{x:.5,y:.5}};const draw=mod.default(ctx,390,640,1,stage);draw(0);draw(8);draw(t);return {c,bytes:ctx.getImageData(0,0,390,640).data};}
const original=pixels({p:'Noche mágica',f:'clear'},12),other=pixels({p:'Noche mágica',f:'elegant'},12);
check(original.bytes.every((v,i)=>v===other.bytes[i]),'La tipografía modificó las letras de partículas');
}catch(e){report.textContent='ERROR: '+e.stack;}
const defaultBytes=(()=>{const c=document.createElement('canvas');c.width=390;c.height=640;mod.default(c.getContext('2d'),390,640,1,{card:{},taps:[],pointer:{x:.5,y:.5}})(5);return c.getContext('2d').getImageData(0,0,390,640).data;})();
try{for(const font of FONT_OPTIONS){const el=document.createElement('article');el.className='sample card';el.innerHTML=`<h2>${font.label}</h2><div class="scene"><canvas width="390" height="640"></canvas><div class="overlay show pos-top"><p class="ov-to"></p><p class="ov-msg"></p><p class="ov-from"></p></div></div>`;samples.append(el);const card={f:font.id,m:'Una noche llena de magia.',d:'Halloween · 31 de octubre',c1:'#32cfff',c2:'#ffaaff'};fillOverlay(el.querySelector('.overlay'),card,anim);const c=el.querySelector('canvas');mod.default(c.getContext('2d'),390,640,1,{card,taps:[],pointer:{x:.5,y:.5}})(5);check(c.getContext('2d').getImageData(0,0,390,640).data.some((v,i)=>v!==defaultBytes[i]),'No cambia el color');}
}catch(e){report.textContent='ERROR: '+e.stack;}
const timer=setInterval(()=>{const doc=editor.contentDocument;if(doc?.getElementById('title')?.textContent!=='Fantasmita rosa')return;clearInterval(timer);try{doc.getElementById('result').scrollIntoView=()=>{};const f=doc.getElementById('form').elements,form=doc.getElementById('form');const input=e=>e.dispatchEvent(new Event('input',{bubbles:true})),change=e=>e.dispatchEvent(new Event('change',{bubbles:true}));const submit=()=>{form.dispatchEvent(new Event('submit',{bubbles:true,cancelable:true}));return decodeCard(new URL(doc.getElementById('link').value).searchParams.get('s'));};check(f.f.options.length===5,'Faltan fuentes');for(const font of FONT_OPTIONS){f.f.value=font.id;input(f.f);check(doc.getElementById('overlay').style.getPropertyValue('--message-font')===font.family,'No aplica fuente');check(submit().f===font.id,'No guarda fuente');}
const enabled=doc.getElementById('colorsEnabled');enabled.checked=true;change(enabled);f.c1.value='#32cfff';f.c2.value='#ffaaff';change(f.c1);change(f.c2);check(submit().c1==='#32cfff','No guarda color');enabled.checked=false;change(enabled);check(!submit().c1&&!submit().c2,'No restaura paleta original');enabled.checked=true;change(enabled);f.f.value='clear';input(f.f);if(!report.textContent.startsWith('ERROR'))report.textContent='OK: 5 fuentes, colores, paleta original, enlace y letras de partículas sin cambios.';
}catch(e){report.textContent='ERROR: '+e.stack;}},25);
</script></html>
