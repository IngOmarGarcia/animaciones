<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex, nofollow">
  <title>Revisión de escenas</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap">
  <link rel="stylesheet" href="../css/styles.css">
  <style>
    body { margin: 0; background: #15121f; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; padding: 8px; }
    figure { margin: 0; }
    figcaption { color: #bbb; font: 11px system-ui; padding-top: 2px; }
    .scene { width: 390px; height: 844px; }
  </style>
</head>
<body>
  <div class="row" id="out"></div>
  <script type="module">
    // Hoja temporal de revisión: avanza el tiempo paso a paso (determinista), compone la escena
    // con la capa de texto real del visor y permite simular toques.
    // ?ids=a,b&t=3,12&p=Nombre&m=Mensaje&d=Firma&mem=uno|dos&tap=9&hold=1&w=390&h=844
    import { getAnimation } from '../js/catalog.js';
    import { fillOverlay } from '../js/overlay.js';

    const q = new URLSearchParams(location.search);
    const ids = (q.get('ids') || '').split(',').filter(Boolean);
    const times = (q.get('t') || '6').split(',').map(Number);
    const W = +(q.get('w') || 390);
    const H = +(q.get('h') || 844);
    const tapAt = q.has('tap') ? +q.get('tap') : 0;
    const tapX = q.has('tapx') ? +q.get('tapx') : 0.5; // fracción del ancho
    const tapY = q.has('tapy') ? +q.get('tapy') : 0.5; // fracción del alto
    const hold = q.get('hold') === '1';
    const card = {
      p: q.get('p') ?? 'Sofía', m: q.get('m') ?? '', d: q.get('d') ?? '',
      lt: q.get('lt') ?? '', l: q.get('l') ?? '', mem: q.get('mem') ?? '',
      c1: q.get('c1') ?? '', c2: q.get('c2') ?? '',
    };
    const out = document.getElementById('out');
    const notes = [];
    // Un fallo de la escena deja el lienzo en blanco: sin esto solo se nota por el peso del PNG
    const fail = (message) => { document.title = `ERROR ${message}`; document.body.dataset.done = '1'; };
    addEventListener('error', (e) => fail(e.message));
    addEventListener('unhandledrejection', (e) => fail(e.reason?.message || e.reason));
    await document.fonts.ready;

    for (const id of ids) {
      for (const target of times) {
        const anim = getAnimation(id);
        const fig = document.createElement('figure');
        const scene = document.createElement('section');
        scene.className = 'scene';
        scene.style.width = `${W}px`;
        scene.style.height = `${H}px`;
        const canvas = document.createElement('canvas');
        const overlay = document.createElement('div');
        overlay.className = 'overlay';
        overlay.innerHTML = '<p class="ov-to"></p><p class="ov-msg"></p><p class="ov-from"></p>';
        scene.append(canvas, overlay);
        const cap = document.createElement('figcaption');
        cap.textContent = `${id} · ${target}s`;
        fig.append(scene, cap);
        out.append(fig);

        fillOverlay(overlay, card, anim);
        canvas.width = W;
        canvas.height = H;
        const ctx = canvas.getContext('2d');
        const stage = { taps: [], pointer: { x: 0.5, y: 0.5 }, holding: hold, revealed: false, card, auto: !tapAt };
        const mod = await anim.load();
        const frame = mod.default(ctx, W, H, 1, stage);
        const dt = 1 / 30;
        const t0 = performance.now();
        let frames = 0;
        for (let t = dt; t <= target + 1e-6; t += dt) {
          if (tapAt && Math.abs(t - tapAt) < dt / 2) stage.taps.push({ x: W * tapX, y: H * tapY });
          ctx.setTransform(1, 0, 0, 1, 0, 0);
          ctx.globalAlpha = 1;
          ctx.globalCompositeOperation = 'source-over';
          ctx.clearRect(0, 0, W, H);
          frame(t, dt);
          frames++;
        }
        overlay.classList.toggle('show', anim.interactive ? stage.revealed : target >= anim.textDelay);
        // Estado interno que la escena quiera exponer para depurar (sin afectar a producción)
        const probe = stage.debugInfo ? ` ${JSON.stringify(stage.debugInfo)}` : '';
        notes.push(`${id}@${target}s ${((performance.now() - t0) / frames).toFixed(1)}ms/cuadro${probe}`);
      }
    }
    document.title = notes.join(' | ');
    document.body.dataset.done = '1';
  </script>
</body>
</html>
