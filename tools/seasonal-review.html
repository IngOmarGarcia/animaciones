<!doctype html><html lang="es"><meta charset="utf-8"><meta name="robots" content="noindex, nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Revisión · Halloween y Día de Muertos</title>
<style>body{margin:0;background:#080611;color:#ffebd1;font:14px system-ui}header{padding:24px}h1{margin:0 0 8px}a{color:#ffd180}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;padding:12px}article{min-width:0;background:#140d21;border:1px solid #39254b;border-radius:16px;overflow:hidden}canvas{width:100%;aspect-ratio:390/640;display:block}h2{font-size:14px;margin:12px}p{margin:12px;color:#d0bcd8}button{background:#ffc371;border:0;border-radius:12px;padding:10px;cursor:pointer}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}}@media(prefers-reduced-motion:reduce){canvas{scroll-behavior:auto}}</style>
<header><h1>Halloween · Día de Muertos</h1><p>31 de octubre · 1 y 2 de noviembre · <a href="/">Abrir portada</a></p><button id="replay">Repetir las diez</button><button id="reveal">Revelar nombres</button><p id="result">Preparando escenas…</p></header><main class="grid" id="grid"></main>
<script type="module">
import { SEASONAL_ANIMATIONS } from '../js/seasonal-catalog.js';
const params=new URLSearchParams(location.search),fixed=params.has('fixed'),frames=[];let start=performance.now();
try{for(const a of SEASONAL_ANIMATIONS){const el=document.createElement('article');el.innerHTML=`<canvas width="390" height="640"></canvas><h2>${a.title}</h2><p><a href="/crear.html?a=${a.id}">Personalizar →</a></p>`;grid.append(el);const canvas=el.querySelector('canvas'),stage={taps:[],pointer:{x:.5,y:.5},card:{p:'María'},preview:false};const mod=await import(`../js/anim/${a.file}.js`);const draw=mod.default(canvas.getContext('2d'),390,640,1,stage);for(const t of [0,2,5,8,10,12,17])draw(t);if(!stage.revealed)throw Error(a.id+' no revela');frames.push({draw,stage});canvas.addEventListener('pointerdown',()=>stage.taps.push({x:195,y:320}));}result.textContent='10 / 10 escenas: formación, transformación y revelación verificadas';
function frame(now){try{const t=fixed?Number(params.get('t')||5):(now-start)/1000%18;for(const f of frames)f.draw(t);if(!fixed)requestAnimationFrame(frame);}catch(e){result.textContent='ERROR: '+e.message;}}requestAnimationFrame(frame);
replay.onclick=()=>{start=performance.now();location.reload();};reveal.onclick=()=>frames.forEach(f=>f.stage.taps.push({x:195,y:320}));
}catch(e){result.textContent='ERROR: '+e.stack;}
</script></html>
