<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Prueba de personajes</title>
  <style>
    html, body { margin: 0; background: #fff; font: 14px system-ui, sans-serif; }
    canvas { display: block; }
    #estado { position: fixed; top: 8px; left: 8px; color: #666; }
  </style>
</head>
<body>
  <div id="estado">Muestreando superficies…</div>
  <canvas id="c"></canvas>
  <script type="module">
    // Prueba aislada del sistema de personajes (no afecta a las animaciones).
    // Todo se dibuja en Canvas 2D desde la superficie muestreada (sin shaders pesados: funciona en cualquier GPU).
    // ?prueba=siluetas → silueta negra de frente y de perfil
    // ?prueba=color    → colores de selección (sin escudos) con sombreado
    // ?prueba=arcilla  → sombreado neutro para revisar volúmenes
    // ?prueba=nube     → nube de puntos girando, con skinning
    // &pose=0 pose neutral (por defecto: gesto icónico de cada jugador) · &t=2.5 un solo cuadro · &yaw=0.6 giro fijo
    import {
      PLAYER_PROFILES, SIGNATURE_POSES, ZONE, buildCharacter, sampleCharacter, createPose, solvePose, skinPoints,
    } from '../js/anim/character.js';

    const q = new URLSearchParams(location.search);
    const mode = q.get('prueba') || 'siluetas';
    const poseOn = q.get('pose') !== '0';
    const canvas = document.getElementById('c');
    const estado = document.getElementById('estado');
    const wait = () => new Promise((r) => setTimeout(r, 0));
    const ids = ['messi', 'neymar', 'cristiano'];

    try {
      const players = ids.map((id) => buildCharacter(PLAYER_PROFILES[id]));
      const N = +(q.get('n') || (mode === 'nube' ? 9000 : 26000));
      const t0 = performance.now();
      const clouds = [];
      for (const ch of players) {
        clouds.push(sampleCharacter(ch, N, clouds.length + 7));
        estado.textContent = `Muestreando superficies… ${clouds.length}/3`;
        await wait();
      }
      const sampleMs = Math.round(performance.now() - t0);
      const buffers = clouds.map((c) => ({
        x: new Float32Array(c.count), y: new Float32Array(c.count), z: new Float32Array(c.count),
        nx: new Float32Array(c.count), ny: new Float32Array(c.count), nz: new Float32Array(c.count),
      }));
      const poses = players.map((ch) => createPose(ch));

      // Pose (gesto + variación opcional) → skinning → apoyar en el suelo
      const pose = (i, extra = {}) => {
        const base = poseOn ? SIGNATURE_POSES[ids[i]] : {};
        const angles = { ...base };
        for (const [k, v] of Object.entries(extra)) {
          const b = angles[k] || [0, 0, 0];
          angles[k] = [b[0] + v[0], b[1] + v[1], b[2] + v[2]];
        }
        solvePose(players[i], angles, poses[i]);
        const b = buffers[i];
        skinPoints(players[i], clouds[i], poses[i], b.x, b.y, b.z, b.nx, b.ny, b.nz);
        let minY = Infinity;
        for (let k = 0; k < clouds[i].count; k++) if (b.y[k] < minY) minY = b.y[k];
        for (let k = 0; k < clouds[i].count; k++) b.y[k] -= minY;
        return b;
      };

      const colorOf = (i, zone) => {
        const kit = PLAYER_PROFILES[ids[i]].kit;
        if (zone === ZONE.HAIR) return kit.hair;
        if (zone === ZONE.SHIRT) return kit.shirt;
        if (zone === ZONE.STRIPE) return kit.stripe || kit.shirt;
        if (zone === ZONE.SHORTS) return kit.shorts;
        if (zone === ZONE.SOCKS) return kit.socks;
        if (zone === ZONE.BOOTS) return kit.boots;
        return kit.skin;
      };

      if (mode !== 'nube') {
        const W = 2100;
        const H = 860;
        canvas.width = W; canvas.height = H;
        const ctx = canvas.getContext('2d');
        const img = ctx.createImageData(W, H);
        const px = img.data;
        const zbuf = new Float32Array(W * H).fill(-Infinity);
        for (let i = 0; i < px.length; i += 4) { px[i] = px[i + 1] = px[i + 2] = 255; px[i + 3] = 255; }
        const scale = (H - 70) / 2.7;
        const panelW = W / 6;
        const RAD = 4;
        const L = [-0.45, 0.7, 0.55].map((v, _, a) => v / Math.hypot(...a));
        const posed = players.map((_, i) => pose(i));
        for (let panel = 0; panel < 6; panel++) {
          const i = panel % 3;
          const b = posed[i];
          const side = panel >= 3;
          const cx = (panel + 0.5) * panelW;
          const left = Math.floor(panel * panelW) + 2;
          const right = Math.floor((panel + 1) * panelW) - 2;
          for (let k = 0; k < clouds[i].count; k++) {
            // Frente: pantalla x = x, profundidad = z. Perfil (desde -x): pantalla x = z, profundidad = -x
            const sxw = side ? b.z[k] : b.x[k];
            const depth = side ? -b.x[k] : b.z[k];
            const facing = side ? -b.nx[k] : b.nz[k];
            if (facing < -0.2) continue;
            const sx = Math.round(cx + sxw * scale);
            const sy = Math.round(H - 40 - b.y[k] * scale);
            let r = 0; let g = 0; let bl = 0;
            if (mode !== 'siluetas') {
              const nx = side ? b.nz[k] : b.nx[k];
              const lit = Math.max(0, nx * L[0] + b.ny[k] * L[1] + facing * L[2]);
              const shade = Math.min(1, 0.3 + 0.7 * lit + 0.08 * Math.pow(1 - Math.abs(facing), 3));
              const c = mode === 'color' ? colorOf(i, clouds[i].zone[k]) : [0.82, 0.82, 0.82];
              r = Math.round(255 * c[0] * shade); g = Math.round(255 * c[1] * shade); bl = Math.round(255 * c[2] * shade);
            }
            for (let dy = -RAD; dy <= RAD; dy++) {
              const yy = sy + dy;
              if (yy < 0 || yy >= H) continue;
              for (let dx = -RAD; dx <= RAD; dx++) {
                if (dx * dx + dy * dy > RAD * RAD + 1) continue;
                const xx = sx + dx;
                if (xx < left || xx > right) continue;
                const idx = yy * W + xx;
                if (depth <= zbuf[idx]) continue;
                zbuf[idx] = depth;
                px[idx * 4] = r; px[idx * 4 + 1] = g; px[idx * 4 + 2] = bl;
              }
            }
          }
        }
        ctx.putImageData(img, 0, 0);
        ctx.fillStyle = '#d0d0d0';
        ctx.fillRect(0, H - 40, W, 1);
        ctx.fillStyle = '#b0b0b0';
        ctx.fillRect(W / 2, 0, 1, H);
        estado.textContent = '';
        document.title = `listo en ${Math.round(performance.now() - t0)} ms (muestreo ${sampleMs} ms)`;
      } else {
        const W = 1200;
        const H = 860;
        canvas.width = W; canvas.height = H;
        document.body.style.background = '#0c0d10';
        estado.style.color = '#888';
        const ctx = canvas.getContext('2d');
        const LIGHT = [-0.45, 0.65, 0.6].map((v, _, a) => v / Math.hypot(...a));
        estado.textContent = '';
        const draw = (t) => {
          ctx.fillStyle = '#0c0d10';
          ctx.fillRect(0, 0, W, H);
          const scale = (H - 70) / 2.3;
          const yaw = q.has('yaw') ? +q.get('yaw') : 0.6 * Math.sin(t * 0.35);
          const cy = Math.cos(yaw);
          const sy = Math.sin(yaw);
          players.forEach((_, i) => {
            const b = pose(i, {
              chest: [0, 0.06 * Math.sin(t * 0.7), 0],
              head: [0.03 * Math.sin(t * 1.1), 0.12 * Math.sin(t * 0.7), 0],
              upperArmL: [0.08 * Math.sin(t * 1.3), 0, 0], upperArmR: [-0.08 * Math.sin(t * 1.3), 0, 0],
            });
            const cx = (W / 3) * (i + 0.5);
            for (let k = 0; k < clouds[i].count; k++) {
              const X = b.x[k] * cy + b.z[k] * sy;
              const nX = b.nx[k] * cy + b.nz[k] * sy;
              const nZ = -b.nx[k] * sy + b.nz[k] * cy;
              if (nZ < -0.12) continue;
              const lit = 0.35 + 0.65 * Math.max(0, nX * LIGHT[0] + b.ny[k] * LIGHT[1] + nZ * LIGHT[2]);
              const c = colorOf(i, clouds[i].zone[k]);
              ctx.fillStyle = `rgb(${Math.round(255 * c[0] * lit)},${Math.round(255 * c[1] * lit)},${Math.round(255 * c[2] * lit)})`;
              ctx.fillRect(cx + X * scale - 0.9, H - 40 - b.y[k] * scale - 0.9, 1.8, 1.8);
            }
          });
        };
        document.title = `muestreo ${sampleMs} ms: ${clouds.map((c) => c.count).join('/')} puntos`;
        if (q.has('t')) {
          draw(+q.get('t'));
        } else {
          const start = performance.now();
          const loop = (now) => { draw((now - start) / 1000); requestAnimationFrame(loop); };
          requestAnimationFrame(loop);
        }
      }
    } catch (err) {
      estado.textContent = 'Error: ' + err.message;
      document.title = 'ERROR ' + err.message;
      throw err;
    }
    document.body.dataset.done = '1';
  </script>
</body>
</html>
