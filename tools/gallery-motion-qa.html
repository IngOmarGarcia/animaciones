<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Revisión de miniaturas</title><link rel="stylesheet" href="/css/styles.css"><style>.grid{padding:12px;grid-template-columns:repeat(4,minmax(0,1fr))}.thumb{height:260px;aspect-ratio:auto}.card-body p{display:none}@media(max-width:719px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.thumb{height:260px}}</style></head><body><div id="grid" class="grid"></div><script type="module">
import {getAnimation} from '/js/catalog.js';
import {renderGallery,setGalleryPaused,galleryDiagnostics,galleryPaused} from '/js/gallery.js';
window.previewQA={show(ids){renderGallery(document.getElementById('grid'),ids.map(getAnimation));scrollTo(0,0);},pause(value){setGalleryPaused(value,{userInitiated:true});},diagnostics:galleryDiagnostics,paused:galleryPaused,pixels(){return [...document.querySelectorAll('.card')].map(card=>{const source=card.querySelector('canvas'),small=document.createElement('canvas');small.width=48;small.height=64;const ctx=small.getContext('2d');ctx.drawImage(source,0,0,48,64);const data=ctx.getImageData(0,0,48,64).data;let hash=2166136261;for(let i=0;i<data.length;i++)hash=Math.imul(hash^data[i],16777619);return {id:card.dataset.id,hash:hash>>>0};});}};
document.body.dataset.ready='true';
</script></body></html>
