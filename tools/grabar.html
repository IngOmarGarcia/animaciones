<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Grabar video vertical | ViralCss</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap">
  <link rel="stylesheet" href="../css/styles.css">
  <style>
    .rec { display: grid; gap: 24px; padding-block: 24px; }
    @media (min-width: 860px) { .rec { grid-template-columns: 300px minmax(0, 1fr); align-items: start; } }
    #out { display: block; width: 270px; height: 480px; margin-inline: auto; border-radius: 18px; background: #000; }
    .form select { display: block; width: 100%; margin-top: 6px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg-2); color: var(--text); font: inherit; font-size: 16px; }
    .form .check { display: flex; align-items: center; gap: 8px; font-weight: 400; }
    .form .check input { display: inline; width: auto; margin: 0; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; }
    .status { min-height: 1.5em; color: var(--muted); }
  </style>
</head>
<body>
  <main class="container rec">
    <canvas id="out" width="1080" height="1920"></canvas>
    <div>
      <h1>Grabar video vertical</h1>
      <p class="muted">Crea un video de 1080×1920 de cualquier animación para subirlo a TikTok, Reels, Shorts o estados de WhatsApp. Usa Chrome o Edge en PC y deja esta pestaña visible mientras graba.</p>
      <form class="form" id="form">
        <label>Animación <select name="a"></select></label>
        <label>Para <input name="p" maxlength="40" placeholder="Opcional"></label>
        <label>Mensaje <input name="m" maxlength="140" placeholder="Vacío = mensaje por defecto"></label>
        <label>De <input name="d" maxlength="40" placeholder="Opcional"></label>
        <label>Duración en segundos <input name="sec" type="number" min="5" max="60" value="12"></label>
        <label class="check"><input type="checkbox" name="mark" checked> Mostrar «Crea la tuya gratis» con la dirección del sitio</label>
        <div class="actions">
          <button class="btn" type="button" id="preview">▶ Vista previa</button>
          <button class="btn btn-primary" type="submit">⏺ Grabar y descargar</button>
        </div>
      </form>
      <p class="status" id="status"></p>
    </div>
  </main>

  <script type="module">
    import { ANIMATIONS, getAnimation } from '../js/catalog.js';
    import { SITE } from '../js/config.js';

    // Se dibuja en coordenadas lógicas de celular (405×720) escaladas a 1080×1920,
    // para que las escenas se vean igual que en el sitio.
    const W = 405;
    const H = 720;
    const K = 1080 / W;
    const MIME_TYPES = ['video/mp4;codecs=avc1.42E01E', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm'];

    const canvas = document.getElementById('out');
    const ctx = canvas.getContext('2d');
    const form = document.getElementById('form');
    const f = form.elements;
    const status = document.getElementById('status');
    let token = 0;

    f.a.replaceChildren(...ANIMATIONS.map((a) => new Option(a.title, a.id)));

    function wrapText(text, maxWidth) {
      const lines = [];
      let line = '';
      for (const word of text.split(' ')) {
        const test = line ? `${line} ${word}` : word;
        if (line && ctx.measureText(test).width > maxWidth) {
          lines.push(line);
          line = word;
        } else {
          line = test;
        }
      }
      if (line) lines.push(line);
      return lines;
    }

    function drawText(anim, card, t) {
      const alpha = Math.min(1, Math.max(0, (t - anim.textDelay) / 1.2));
      if (alpha <= 0) return;
      const blocks = [];
      if (card.p) blocks.push({ text: `PARA ${card.p.toUpperCase()}`, font: '800 16px system-ui, "Segoe UI", sans-serif', color: '#ffc300', lineHeight: 24, spacing: '2px' });
      blocks.push({ text: card.m || anim.defaultMessage, font: '700 36px "Dancing Script", cursive', color: '#ffffff', lineHeight: 42 });
      if (card.d) blocks.push({ text: `Con cariño, ${card.d}`, font: '700 22px "Dancing Script", cursive', color: '#ffe8a3', lineHeight: 32 });

      const lines = [];
      for (const block of blocks) {
        ctx.font = block.font;
        ctx.letterSpacing = block.spacing || '0px';
        for (const text of wrapText(block.text, W * 0.86)) lines.push({ ...block, text });
      }
      ctx.letterSpacing = '0px';

      const total = lines.reduce((sum, l) => sum + l.lineHeight, 0);
      let y = (anim.textPosition === 'center' ? (H - total) / 2 : W * 0.09) + 12 * (1 - alpha);
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.shadowColor = 'rgba(0, 0, 0, 0.7)';
      ctx.shadowBlur = 14 * K;
      ctx.shadowOffsetY = 2 * K;
      for (const line of lines) {
        ctx.font = line.font;
        ctx.letterSpacing = line.spacing || '0px';
        ctx.fillStyle = line.color;
        ctx.fillText(line.text, W / 2, y + line.lineHeight / 2);
        y += line.lineHeight;
      }
      ctx.restore();
    }

    function drawWatermark() {
      const text = `Crea la tuya gratis 👉 ${new URL(SITE.url).host}`;
      ctx.save();
      ctx.font = '700 13px system-ui, "Segoe UI", sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      const width = ctx.measureText(text).width + 24;
      const y = H - 40;
      ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
      ctx.beginPath();
      ctx.roundRect(W / 2 - width / 2, y - 14, width, 28, 14);
      ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.fillText(text, W / 2, y + 1);
      ctx.restore();
    }

    async function run(record) {
      const myToken = ++token;
      const anim = getAnimation(f.a.value);
      const card = { p: f.p.value.trim(), m: f.m.value.trim(), d: f.d.value.trim() };
      const seconds = Math.min(60, Math.max(5, Number(f.sec.value) || 12));

      await document.fonts.load('700 36px "Dancing Script"');
      const create = (await anim.load()).default;
      ctx.setTransform(K, 0, 0, K, 0, 0);
      // auto: las escenas interactivas avanzan solas porque en el video nadie toca.
      const frame = create(ctx, W, H, K, { taps: [], revealed: false, card, auto: true });

      let recorder = null;
      if (record) {
        const mimeType = MIME_TYPES.find((type) => MediaRecorder.isTypeSupported(type));
        if (!mimeType) {
          status.textContent = 'Este navegador no puede grabar video. Usa Chrome o Edge en PC.';
          return;
        }
        const stream = canvas.captureStream(30);
        const chunks = [];
        recorder = new MediaRecorder(stream, { mimeType, videoBitsPerSecond: 8_000_000 });
        recorder.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
        recorder.onstop = () => {
          stream.getTracks().forEach((track) => track.stop());
          if (myToken !== token) return; // grabación cancelada
          const blob = new Blob(chunks, { type: mimeType });
          const link = document.createElement('a');
          link.href = URL.createObjectURL(blob);
          link.download = `${anim.id}.${mimeType.startsWith('video/mp4') ? 'mp4' : 'webm'}`;
          link.click();
          status.textContent = `Listo: ${link.download} (${(blob.size / 1048576).toFixed(1)} MB).`;
        };
        recorder.start();
      }

      const start = performance.now();
      let last = start;
      const loop = (now) => {
        if (myToken !== token) {
          if (recorder && recorder.state !== 'inactive') recorder.stop();
          return;
        }
        const t = (now - start) / 1000;
        const dt = Math.min((now - last) / 1000, 0.1);
        last = now;
        ctx.setTransform(K, 0, 0, K, 0, 0);
        ctx.globalAlpha = 1;
        ctx.globalCompositeOperation = 'source-over';
        frame(t, dt);
        ctx.setTransform(K, 0, 0, K, 0, 0);
        drawText(anim, card, t);
        if (f.mark.checked) drawWatermark();

        if (t >= seconds) {
          if (recorder) recorder.stop();
          else status.textContent = 'Vista previa terminada.';
          return;
        }
        status.textContent = `${record ? '⏺ Grabando' : '▶ Vista previa'}: ${t.toFixed(1)} / ${seconds} s`;
        requestAnimationFrame(loop);
      };
      requestAnimationFrame(loop);
    }

    document.getElementById('preview').addEventListener('click', () => run(false));
    form.addEventListener('submit', (event) => {
      event.preventDefault();
      run(true);
    });
  </script>
</body>
</html>
